services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerlab}
      POSTGRES_DB: careerlab
    ports:
      # Bound to this machine only: the database has a default password that is public in this repo.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerlab} -d careerlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development-only values so `docker compose up` works from a fresh .env.
      # Deployments must set real values (JWT_SECRET is required to be 32+ characters).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careerlab}:${POSTGRES_PASSWORD:-careerlab}@db:5432/careerlab
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-outside-local-compose}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Production keeps the default of 5. CI raises it so the e2e suite can register several users.
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-5}
      RATE_LIMIT_REGISTER_GLOBAL_PER_MINUTE: ${RATE_LIMIT_REGISTER_GLOBAL_PER_MINUTE:-30}
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # Baked into the build: Next.js proxies /api/v1/* to this address.
        API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
