name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerlab
          POSTGRES_PASSWORD: careerlab
          POSTGRES_DB: careerlab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerlab -d careerlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://careerlab:careerlab@localhost:5433/careerlab_test
      JWT_SECRET: ci-only-secret-not-for-real-use-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['dependencies'] + p['optional-dependencies']['dev']))" > requirements-ci.txt
          pip install -r requirements-ci.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The build bakes this into the /api/v1/* rewrite. Nothing calls it during the build.
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Pull requests only: it builds and runs the whole stack, which is slow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The suite registers several users from one IP, which the production limit of 5 per minute blocks.
      RATE_LIMIT_REGISTER_PER_MINUTE: "1000"
      # The all-IPs backstop (default 30 per minute) would also block one run of about 25 registrations.
      RATE_LIMIT_REGISTER_GLOBAL_PER_MINUTE: "1000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Wait for the site and the API
        run: |
          for url in http://localhost:8000/health http://localhost:3000/login; do
            for attempt in $(seq 1 30); do
              curl -fsS -o /dev/null "$url" && break
              [ "$attempt" -eq 30 ] && { echo "$url never became ready"; exit 1; }
              sleep 2
            done
          done
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
